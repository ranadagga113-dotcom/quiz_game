<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة سؤال وجواب</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 50px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { font-size: 16px; margin: 10px 5px; padding: 10px 20px; cursor: pointer; border: none; background: #007bff; color: white; border-radius: 5px; }
        button:hover { background: #0056b3; }
        #result { font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>سؤال: ما هي عاصمة فلسطين؟</h2>
        <button onclick="check('خطأ')">غزة</button>
        <button onclick="check('صح')">القدس</button>
        <button onclick="check('خطأ')">حيفا</button>
        <p id="result"></p>
    </div>

    <script>
        function check(answer) {
            const res = document.getElementById('result');
            if(answer === 'صح') {
                res.innerText = " إجابة صحيحة!";
                res.style.color = "green";
            } else {
                res.innerText = " إجابة خاطئة، حاول مرة أخرى!";
                res.style.color = "red";
            }
        }
    </script>
</body>
</html>
